services:
  theatre-bot:
    build:
      context: .
      dockerfile: Containerfile
    container_name: theatre-bot
    restart: unless-stopped
    
    # Environment from .env file
    env_file:
      - .env
    
    # Expose web UI
    ports:
      - "${SERVER_PORT:-8080}:8080"
    
    # Shared memory for Chrome
    shm_size: 2gb
    
    # Security options for Chrome
    security_opt:
      - seccomp:unconfined
    
    # Optional: Mount config for persistence
    # volumes:
    #   - ./data:/app/data
